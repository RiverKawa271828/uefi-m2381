#
# Boot Shim Configs
#
[boot_shim]
requires_kernel_header     = true
disable_gunyah_watchdog    = true

#
# UEFI FD Configs
#
[uefi_fd]
base = 0xA7100000
size = 0x300000

#
# Android Boot Image Kernel Configs
#
[boot_image_kernel]
kernel_compression = "gzip"
append_dtb         = false

#
# Android Boot Image Configs
#
[boot_image]
header_version = 4
os_version     = "15.0.0"
os_patch_level = "2025-11"
